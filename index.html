<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f2ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111111" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tanks a lot">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Tanks a lot</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="views">
  <section class="view" id="view-tanks" hidden></section>
  <section class="view" id="view-rain" hidden></section>
  <section class="view" id="view-outlook" hidden></section>
</div>

<nav class="tabbar" role="tablist">
  <button role="tab" data-tab="tanks" aria-label="Tanks">
    <svg viewBox="0 0 24 24"><path d="M6 4h12v15a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M6.9 12.5h10.2V19H6.9z" fill="currentColor" opacity=".9"/></svg>
    <span>Tanks</span>
  </button>
  <button role="tab" data-tab="rain" aria-label="Rain">
    <svg viewBox="0 0 24 24"><path d="M12 3.5c3.3 4.2 5.5 7.4 5.5 10.2a5.5 5.5 0 0 1-11 0c0-2.8 2.2-6 5.5-10.2z" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
    <span>Rain</span>
  </button>
  <button role="tab" data-tab="outlook" aria-label="Outlook">
    <svg viewBox="0 0 24 24"><path d="M4 18l5-6 4 3 7-9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 20h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    <span>Outlook</span>
  </button>
</nav>

<div class="tip" id="tip" role="status"></div>
<script src="app.js"></script>
</body>
</html>

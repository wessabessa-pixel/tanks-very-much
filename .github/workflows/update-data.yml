name: Update rain data
on:
  schedule:
    - cron: '17 23 * * *'   # ~09:47 Adelaide daily (SILO publishes yesterday's rain each morning)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Rebuild data/rain.json from SILO
        env: { SILO_EMAIL: '${{ secrets.SILO_EMAIL }}' }
        run: python scripts/update_data.py
      - name: Commit if changed
        run: |
          git config user.name "tanks-a-lot-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/rain.json
          git diff --cached --quiet || git commit -m "Daily rain data update" && git push
